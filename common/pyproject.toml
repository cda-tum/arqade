[project]
name = "arqade-common"
version = "0.1.0"
description = "Code shared by the Arqade games: input devices and layouts, browser hooks"
readme = "README.md"
requires-python = ">=3.11"
# Works with pygame 2.5.2 (the cabinet) and pygame-ce (desktop and browser);
# the games themselves pick which one to install.
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pygame-ce>=2.5.6",
]
