[project]
name = "error-invaders"
version = "0.1.0"
description = "Retro-meets-quantum-error-correction Space Invaders arcade game"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pygame==2.5.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
