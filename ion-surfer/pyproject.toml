[project]
name = "ion-surfer"
version = "0.1.0"
description = "Ion-trap surfing arcade game: shape the trap potential to keep your ion on screen"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pygame==2.5.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
