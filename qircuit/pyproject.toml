[project]
name = "qircuit"
version = "0.1.0"
description = "Slot-car racing on the wires of a quantum circuit: gas, brake, change wires, and every power-up is a gate"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pygame==2.5.2",
    "pyopengl==3.1.10",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
