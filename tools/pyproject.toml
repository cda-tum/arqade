[project]
name = "arqade-tools"
version = "0.1.0"
description = "Build tools for the Arqade games (web build)"
requires-python = ">=3.11"
dependencies = [
    # Pinned: each pygbag version pins its browser runtime (Python, pygame-ce).
    "pygbag==0.9.3",
    # Only to compose the thumbnails from batocera/logos.
    "pygame-ce>=2.5.6",
]

[tool.uv]
package = false
